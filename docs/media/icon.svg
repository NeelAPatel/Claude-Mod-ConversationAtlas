<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Conversation Atlas: two speech bubbles joined by a dashed trail with a map pin">
  <title>Conversation Atlas</title>
  <rect width="256" height="256" rx="56" fill="#1b1f2a"/>
  <!-- dashed trail from bubble to bubble -->
  <path d="M62 92 C 62 168, 194 88, 194 164" fill="none" stroke="#c9cfdd" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 17"/>
  <!-- upper-left bubble -->
  <path d="M40 28 h56 a18 18 0 0 1 18 18 v22 a18 18 0 0 1 -18 18 h-26 l-20 16 v-16 h-10 a18 18 0 0 1 -18 -18 v-22 a18 18 0 0 1 18 -18 z" fill="#e8825f"/>
  <!-- lower-right bubble -->
  <path d="M216 228 h-56 a18 18 0 0 1 -18 -18 v-22 a18 18 0 0 1 18 -18 h26 l20 -16 v16 h10 a18 18 0 0 1 18 18 v22 a18 18 0 0 1 -18 18 z" fill="#6f9bff"/>
  <!-- map pin at the midpoint -->
  <g transform="translate(128 116) scale(1.25)">
    <path d="M0 38 C -26 10, -28 2, -28 -8 a28 28 0 0 1 56 0 c0 10 -2 18 -28 46 z" fill="#ffffff"/>
    <circle cx="0" cy="-8" r="10" fill="#1b1f2a"/>
  </g>
</svg>
